<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Velour Essence — Prototype</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- Three.js for Interactive 3D Bottle Rendering -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
  :root{
    --burgundy:#3D0C13;
    --burgundy-dark:#2A080D;
    --gold:#C5A059;
    --gold-light:#E4CFA0;
    --silk:#F4EAD8;
    --cream:#FAF7F2;
    --ink:#2A2018;
    --gray:#7A7168;
    --line:#E8E0D0;
    --green:#1E8E3E;
    --green-bg:#EAF6ED;
    --green-text:#1E6B33;
    --red-bg:#FBEAEA;
    --red-text:#B3261E;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Plus Jakarta Sans',sans-serif;
    background: linear-gradient(180deg,#E9E2D3, #DDD4C1);
    min-height:100vh;
    color:var(--ink);
  }
  .frame{
    width:100%;
    min-height:100vh;
    background:var(--cream);
  }
  .promo{
    background:var(--gold);
    color:var(--burgundy);
    font-size:13px;
    font-weight:700;
    text-align:center;
    padding:9px 16px;
    letter-spacing:0.2px;
  }
  .promo svg{vertical-align:-2px;margin-right:6px;}

  header.nav{
    background:#fff;
    border-bottom:1px solid var(--line);
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    gap:14px 24px;
    padding:16px 32px;
  }
  .brandmark{
    display:flex;
    align-items:center;
    gap:12px;
    flex-shrink:0;
  }
  .crest{
    width:44px;height:44px;border-radius:50%;
    border:2px solid var(--gold);
    display:flex;align-items:center;justify-content:center;
    color:var(--burgundy);
    background:#fff;
  }
  .wordmark{
    font-family:'Cinzel',serif;
    font-weight:600;
    font-size:17px;
    line-height:1.15;
    color:var(--burgundy);
  }
  .tagline{
    font-size:9.5px;
    letter-spacing:1px;
    color:var(--gold);
    font-weight:700;
    text-transform:uppercase;
    margin-top:2px;
  }
  .navwrap{
    flex:1;
    min-width:0;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .navscroll{
    display:flex;
    flex:1;
    min-width:0;
    gap:8px;
    overflow-x:auto;
    scrollbar-width:thin;
    padding-bottom:4px;
  }
  .navscroll::-webkit-scrollbar{height:5px;}
  .navscroll::-webkit-scrollbar-thumb{background:#c9bfa8;border-radius:10px;}
  .pill{
    flex-shrink:0;
    border:1px solid var(--line);
    background:#fff;
    color:var(--ink);
    font-size:12.5px;
    font-weight:600;
    padding:8px 14px;
    border-radius:20px;
    cursor:pointer;
    white-space:nowrap;
    display:flex;
    align-items:center;
    gap:6px;
    transition:all .15s ease;
  }
  .pill:hover{border-color:var(--gold);}
  .pill.active{
    background:var(--burgundy);
    color:#fff;
    border-color:var(--burgundy);
  }
  .badge{
    background:var(--gold);
    color:var(--burgundy);
    font-size:10.5px;
    font-weight:800;
    width:16px;height:16px;
    border-radius:50%;
    display:flex;align-items:center;justify-content:center;
  }
  .pill.active .badge{background:#fff;color:var(--burgundy);}
  .navarrow{
    background:none;border:none;color:var(--gray);cursor:pointer;font-size:16px;
    flex-shrink:0;
  }

  main{
    padding:36px 40px 60px;
    min-height:520px;
  }
  main.anim{animation:screenIn .32s ease;}
  @keyframes screenIn{
    from{opacity:0;transform:translateY(6px);}
    to{opacity:1;transform:translateY(0);}
  }
  @media (prefers-reduced-motion: reduce){
    main{animation:none;}
    .moodcard, .tiercard{transition:none;}
  }
  button:focus-visible, input:focus-visible, select:focus-visible, .pill:focus-visible, .quizopt:focus-visible{
    outline:2px solid var(--gold);
    outline-offset:2px;
  }
  .kicker{
    display:inline-block;
    background:var(--burgundy);
    color:#fff;
    font-size:11px;
    font-weight:700;
    letter-spacing:0.4px;
    padding:6px 12px;
    border-radius:20px;
    margin-bottom:14px;
  }
  .eyebrow{
    color:var(--gold);
    font-size:12px;
    font-weight:700;
    letter-spacing:1px;
    text-transform:uppercase;
    margin-bottom:6px;
  }
  h1{
    font-family:'Cinzel',serif;
    color:var(--burgundy);
    font-size:28px;
    margin:0 0 8px;
  }
  .subtext{color:var(--gray);font-size:14.5px;margin:0 0 28px;max-width:640px;}

  .grid{display:grid;gap:20px;}
  .grid-3{grid-template-columns:repeat(3,1fr);}
  .grid-2{grid-template-columns:repeat(2,1fr);}

  .card{
    background:#fff;
    border:1px solid var(--line);
    border-radius:14px;
    padding:26px;
    box-shadow:0 6px 20px rgba(61,12,19,0.05);
  }
  .card h3{
    font-family:'Cinzel',serif;
    color:var(--burgundy);
    font-size:19px;
    margin:0 0 10px;
    text-align:center;
  }
  .tag{
    display:inline-flex;align-items:center;gap:6px;
    background:var(--silk);
    color:var(--burgundy);
    font-size:12.5px;
    font-weight:600;
    padding:5px 12px;
    border-radius:20px;
    margin:0 auto 14px;
  }
  .tagrow{text-align:center;}
  .likebar{
    background:#F1ECE2;
    color:var(--gray);
    font-style:italic;
    font-size:13px;
    text-align:center;
    padding:8px;
    border-radius:6px;
    margin-bottom:14px;
  }
  .price{
    font-family:'Cinzel',serif;
    color:var(--burgundy);
    font-weight:700;
    font-size:24px;
    text-align:center;
    margin-bottom:16px;
  }
  .btn{
    display:block;
    width:100%;
    background:var(--burgundy);
    color:#fff;
    border:none;
    padding:13px;
    border-radius:7px;
    font-size:12.5px;
    font-weight:700;
    letter-spacing:0.6px;
    text-transform:uppercase;
    cursor:pointer;
    text-align:center;
    font-family:'Plus Jakarta Sans',sans-serif;
    transition:background .15s;
  }
  .btn:hover{background:var(--burgundy-dark);}
  .btn.green{background:var(--green);}
  .btn.green:hover{background:#166b2f;}
  .btn.ghost{background:transparent;color:var(--burgundy);border:1px solid var(--burgundy);}

  .voucherbar{
    background:var(--silk);
    color:var(--burgundy);
    font-size:12.5px;
    font-weight:600;
    padding:9px 12px;
    border-radius:6px;
    margin-bottom:16px;
  }
  .kitprice{
    font-family:'Cinzel',serif;
    color:var(--burgundy);
    font-weight:700;
    font-size:22px;
    margin-bottom:14px;
  }

  /* Personalize */
  .split{display:grid;grid-template-columns:1fr 1fr;gap:28px;align-items:start;}
  label.field-label{
    display:block;font-size:11px;font-weight:700;letter-spacing:0.6px;
    text-transform:uppercase;color:var(--gray);margin-bottom:8px;
  }
  .field{margin-bottom:22px;}
  .fielderror{color:var(--red-text);font-size:12px;font-weight:600;margin-top:6px;}
  input[type=text]{
    width:100%;
    padding:12px 14px;
    border:1px solid var(--line);
    border-radius:7px;
    font-size:14px;
    font-family:'Plus Jakarta Sans',sans-serif;
    color:var(--ink);
    background:#fff;
  }
  input[type=text]:focus{outline:2px solid var(--gold);border-color:var(--gold);}
  .preview-wrap{
    background:#F1ECE2;
    border:1px solid var(--line);
    border-radius:14px;
    padding:20px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
  }
  .bottlecap{
    width:34px;height:20px;background:var(--gold);
    border-radius:4px 4px 2px 2px;
    margin:0 auto -1px;
  }
  .label{
    width:220px;
    border:2px solid var(--gold);
    border-radius:8px;
    background:var(--cream);
    padding:26px 16px;
    text-align:center;
  }
  .label .lv{font-family:'Cinzel',serif;font-size:9px;letter-spacing:2px;color:var(--gray);margin-bottom:14px;}
  .label .lt{font-family:'Cinzel',serif;font-weight:700;font-size:15px;color:var(--burgundy);margin-bottom:6px;word-break:break-word;}
  .label .ls{font-size:8.5px;letter-spacing:1px;color:var(--gray);text-transform:uppercase;}

  /* 3D Bottle Canvas */
  #bottleCanvas{
    width:100%;
    height:280px;
    border-radius:12px;
    background:transparent;
    cursor:grab;
  }

  /* Cart / Checkout */
  .cartlist{display:flex;flex-direction:column;gap:14px;}
  .cartitem{
    display:flex;align-items:center;gap:16px;
    background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px;
  }
  .cicon{
    width:38px;height:38px;border-radius:50%;border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--burgundy);
  }
  .cititle{font-weight:700;font-size:14.5px;}
  .cisub{font-size:12px;color:var(--gold);font-weight:600;margin-top:2px;}
  .ciprice{margin-left:auto;font-family:'Cinzel',serif;font-weight:700;color:var(--burgundy);font-size:16px;flex-shrink:0;text-align:right;}
  .ciunit{font-family:'Plus Jakarta Sans',sans-serif;font-weight:600;font-size:11px;color:var(--gray);margin-top:2px;}
  .qtystepper{display:flex;align-items:center;gap:10px;margin-top:8px;}
  .qtybtn{
    width:24px;height:24px;border-radius:50%;border:1px solid var(--line);background:#fff;
    color:var(--burgundy);font-size:15px;font-weight:700;line-height:1;cursor:pointer;
    display:flex;align-items:center;justify-content:center;transition:all .15s;
  }
  .qtybtn:hover{border-color:var(--gold);background:var(--silk);}
  .qtyval{font-size:13px;font-weight:700;min-width:16px;text-align:center;}
  .removebtn{
    flex-shrink:0;width:30px;height:30px;border-radius:50%;
    background:transparent;border:1px solid var(--line);color:var(--gray);
    display:flex;align-items:center;justify-content:center;cursor:pointer;
    margin-left:10px;transition:all .15s;
  }
  .removebtn:hover{background:var(--red-bg);border-color:var(--red-text);color:var(--red-text);}
  .btn:disabled{background:var(--line);color:var(--gray);cursor:not-allowed;}
  .btn:disabled:hover{background:var(--line);}
  .summarycard{background:#fff;border:1px solid var(--line);border-radius:12px;padding:22px;height:fit-content;}
  .summarylabel{color:var(--gold);font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;margin-bottom:14px;}
  .totalrow{display:flex;justify-content:space-between;font-weight:700;font-size:15px;margin-bottom:20px;padding-bottom:16px;border-bottom:1px solid var(--line);}

  .radio-row{
    display:flex;align-items:center;gap:12px;
    border:1px solid var(--line);border-radius:8px;
    padding:14px 16px;margin-bottom:10px;cursor:pointer;
    font-size:14px;font-weight:600;
    transition:all .15s;
  }
  .radio-row.selected{border-color:var(--burgundy);background:var(--silk);}
  .radiodot{width:18px;height:18px;border-radius:50%;border:2px solid var(--gray);flex-shrink:0;position:relative;}
  .radio-row.selected .radiodot{border-color:var(--burgundy);}
  .radio-row.selected .radiodot::after{
    content:'';position:absolute;inset:3px;border-radius:50%;background:var(--burgundy);
  }

  /* Brand Pages & Controls */
  .infocard h4{
    font-size:11px;letter-spacing:0.6px;text-transform:uppercase;color:var(--gold);
    margin:0 0 8px;font-weight:700;
  }
  .infocard strong{display:block;font-size:15px;margin-bottom:6px;color:var(--ink);}
  .infocard p, .infocard li{font-size:13.5px;color:var(--gray);line-height:1.6;}
  .infocard ul{margin:0;padding-left:18px;}
  .divider{border:none;border-top:1px solid var(--gold-light);margin:28px 0 20px;}
  h2.section{
    font-family:'Cinzel',serif;color:var(--burgundy);font-size:16px;margin:0 0 4px;
    display:flex;align-items:center;gap:9px;
  }
  h2.section::before{
    content:'';width:7px;height:7px;background:var(--gold);
    transform:rotate(45deg);flex-shrink:0;
  }

  .crestcard{text-align:center;padding:30px 20px;}
  .crestcard.dark{background:var(--burgundy);color:#fff;}
  .crestcard.dark .crestcircle{border-color:var(--gold);}
  .crestcircle{
    width:52px;height:52px;border-radius:50%;border:2px solid var(--burgundy);
    display:flex;align-items:center;justify-content:center;margin:0 auto 12px;
    font-family:'Cinzel',serif;font-weight:700;color:inherit;
  }
  .crestlabel{font-weight:700;font-size:14px;margin-bottom:4px;}
  .crestsub{font-size:12px;color:var(--gray);}
  .crestcard.dark .crestsub{color:#E4CFA0;}

  .toast{
    position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(20px);
    background:var(--burgundy);color:#fff;padding:12px 22px;border-radius:30px;
    font-size:13.5px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,0.25);
    opacity:0;pointer-events:none;transition:all .25s ease;z-index:999;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  /* Guarantee + Tier Pricing */
  .guarantee-card{
    background:#fff;border:1px solid var(--gold);border-left:4px solid var(--gold);
    border-radius:8px;padding:16px 18px;margin-bottom:24px;
    display:flex;gap:14px;align-items:flex-start;
  }
  .guarantee-card svg{flex-shrink:0;margin-top:2px;}
  .guarantee-card div{font-size:13.5px;line-height:1.55;color:var(--ink);}
  .tiergrid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:28px;}
  .tiercard{
    background:#fff;border:1px solid var(--line);border-radius:12px;
    padding:20px;text-align:center;cursor:pointer;transition:all .15s;
  }
  .tiercard:hover{transform:translateY(-2px);}
  .tiercard.featured{border:1.5px solid var(--gold);}
  .tiername{font-weight:700;color:var(--burgundy);font-size:13.5px;margin-bottom:6px;}
  .tierprice{font-family:'Cinzel',serif;color:var(--burgundy);font-weight:700;font-size:20px;}
  .tiersub{font-size:11.5px;color:var(--gold);font-weight:600;margin-top:4px;}

  /* Studio Sliders & Accord Pyramid */
  .studiogrid2{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
  .slidergroup{margin-bottom:18px;}
  .sliderlabel{display:flex;justify-content:space-between;font-size:13px;font-weight:600;margin-bottom:6px;}
  .sliderlabel span:last-child{color:var(--burgundy);font-family:'Cinzel',serif;}
  input[type=range]{
    width:100%;accent-color:var(--burgundy);
  }
  select.input-select{
    width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:7px;
    font-size:13.5px;font-family:'Plus Jakarta Sans',sans-serif;background:#fff;color:var(--ink);margin-top:6px;
  }
  
  /* Scent Accord Pyramid Visualizer */
  .pyramid-wrap{
    background:#fff;border:1px solid var(--line);border-radius:12px;padding:20px;margin-top:20px;
  }
  .pyramid-tier{
    margin-bottom:12px;
  }
  .pyramid-title{font-size:11px;font-weight:700;color:var(--gold);text-transform:uppercase;letter-spacing:0.8px;display:flex;justify-content:space-between;}
  .pyramid-bar-bg{height:10px;background:var(--silk);border-radius:5px;overflow:hidden;margin-top:4px;}
  .pyramid-bar-fill{height:100%;background:var(--burgundy);width:0%;transition:width 0.3s ease;}

  .hero{
    display:grid;grid-template-columns:1.1fr 0.9fr;gap:36px;align-items:center;
    margin-bottom:44px;
  }
  .hero h1{font-size:34px;margin-bottom:14px;line-height:1.15;}
  .hero p.subtext{font-size:15.5px;margin-bottom:26px;}
  .herobtns{display:flex;gap:12px;}
  .herobtns .btn{width:auto;padding:13px 22px;}
  .heroart{
    border-radius:16px;overflow:hidden;
    display:flex;align-items:center;justify-content:center;
  }
  .heroart svg{width:100%;height:auto;display:block;}
  .moodgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-bottom:8px;}
  .moodcard{
    background:#fff;border:1px solid var(--line);border-radius:12px;padding:20px;
    cursor:pointer;transition:all .15s;text-align:center;
  }
  .moodcard:hover{border-color:var(--gold);transform:translateY(-2px);}
  .moodcard .micon{font-size:26px;margin-bottom:8px;}
  .moodcard b{display:block;font-size:14.5px;color:var(--burgundy);margin-bottom:4px;font-family:'Cinzel',serif;}
  .moodcard span{font-size:12px;color:var(--gray);}

  /* Studio Comparison Drawer */
  .saved-formulas{
    margin-top:20px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px;
  }
  .saved-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line);font-size:13px;}

  /* Matcher / Quiz */
  .quizwrap{max-width:640px;}
  .quizprogress{display:flex;gap:6px;margin-bottom:24px;}
  .quizprogress .seg{flex:1;height:4px;border-radius:4px;background:var(--line);}
  .quizprogress .seg.done{background:var(--gold);}
  .quizq{font-family:'Cinzel',serif;font-size:19px;color:var(--burgundy);margin-bottom:18px;}
  .quizopt{
    display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--line);
    border-radius:10px;padding:16px 18px;margin-bottom:12px;font-size:14.5px;font-weight:600;
    cursor:pointer;transition:all .15s;font-family:'Plus Jakarta Sans',sans-serif;color:var(--ink);
  }
  .quizopt:hover{border-color:var(--gold);background:var(--silk);}
  .resultcard{
    background:#fff;border:1px solid var(--line);border-radius:14px;padding:32px;text-align:center;
  }
  .resultcard .rlabel{color:var(--gold);font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase;margin-bottom:8px;}
  .resultcard h3{font-family:'Cinzel',serif;color:var(--burgundy);font-size:26px;margin:0 0 10px;}
  .resultcard p{color:var(--gray);font-size:14.5px;margin-bottom:22px;}
  .resultbtns{display:flex;gap:12px;justify-content:center;}
  .resultbtns .btn{width:auto;padding:13px 22px;}

  /* Live Lab Tracker UI */
  .tracker-step{
    display:flex;align-items:center;gap:12px;margin-bottom:12px;font-size:13px;
  }
  .tracker-dot{width:14px;height:14px;border-radius:50%;background:var(--line);}
  .tracker-dot.active{background:var(--gold);box-shadow:0 0 8px var(--gold);}
  .tracker-dot.done{background:var(--green);}

  @media (max-width: 860px){
    .hero, .moodgrid{grid-template-columns:1fr;}
    .split, .grid-2, .grid-3, .studiogrid2{grid-template-columns:1fr;}
    header.nav{padding:14px 18px;}
    main{padding:24px 18px 50px;}
  }

  @media (max-width: 640px){
    header.nav{padding:12px 16px;gap:10px;}
    .navwrap{flex:1 1 100%;order:3;width:100%;}
    .tagline{display:none;}
    .wordmark{font-size:15px;}
    .crest{width:36px;height:36px;}
    main{padding:20px 16px 44px;}
  }
</style>
</head>
<body>

<div class="frame">
  <div class="promo">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#3D0C13" stroke-width="2"><path d="M12 2l8 4v6c0 5-3.5 8.5-8 10-4.5-1.5-8-5-8-10V6l8-4z"/></svg>
    RISK-FREE GUARANTEE: Every bottle includes a free 2ml sample. Test it first—return unopened for a 100% refund!
  </div>

  <header class="nav">
    <div class="brandmark">
      <div class="crest">
        <svg width="26" height="26" viewBox="0 0 100 100" fill="none">
          <circle cx="50" cy="50" r="46" stroke="#C5A059" stroke-width="2.5"/>
          <circle cx="50" cy="50" r="40" stroke="#3D0C13" stroke-width="1"/>
          <path d="M34 34L40 41L50 29L60 41L66 34L69 46H31L34 34Z" fill="#C5A059" stroke="#3D0C13" stroke-width="0.6"/>
          <path d="M32 50H44L50 66L56 50H68L54 74H46L32 50Z" fill="#3D0C13"/>
        </svg>
      </div>
      <div>
        <div class="wordmark">VELOUR<br>ESSENCE</div>
        <div class="tagline">Affordable Luxury Perfumery</div>
      </div>
    </div>
    <div class="navwrap">
      <button class="navarrow" onclick="scrollNav(-1)">&#8249;</button>
      <div class="navscroll" id="navscroll"></div>
      <button class="navarrow" onclick="scrollNav(1)">&#8250;</button>
    </div>
  </header>

/* ---------- 3D Canvas Engine ---------- */
let threeScene, threeCamera, threeRenderer, bottleMesh, liquidMesh;

function init3DBottle(canvasId, liquidHex = 0xC5A059) {
  const container = document.getElementById(canvasId);
  if(!container || typeof THREE === 'undefined') return;

  const width = container.clientWidth || 300;
  const height = 280;

  threeScene = new THREE.Scene();
  threeCamera = new THREE.PerspectiveCamera(45, width / height, 0.1, 1000);
  threeCamera.position.z = 6;

  threeRenderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
  threeRenderer.setSize(width, height);
  container.innerHTML = '';
  container.appendChild(threeRenderer.domElement);

  // Lighting
  const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
  threeScene.add(ambientLight);

  const dirLight = new THREE.DirectionalLight(0xfff5e6, 1.2);
  dirLight.position.set(5, 10, 7);
  threeScene.add(dirLight);

  // Glass Bottle Outer
  const glassGeo = new THREE.BoxGeometry(1.6, 2.4, 1.0);
  const glassMat = new THREE.MeshPhysicalMaterial({
    color: 0xffffff,
    transparent: true,
    opacity: 0.35,
    roughness: 0.1,
    transmission: 0.9,
    thickness: 0.5
  });
  bottleMesh = new THREE.Mesh(glassGeo, glassMat);

  // Perfume Liquid Inner
  const liquidGeo = new THREE.BoxGeometry(1.4, 1.8, 0.8);
  const liquidMat = new THREE.MeshStandardMaterial({
    color: liquidHex,
    roughness: 0.2,
    metalness: 0.1,
    transparent: true,
    opacity: 0.85
  });
  liquidMesh = new THREE.Mesh(liquidGeo, liquidMat);
  liquidMesh.position.y = -0.2;
  bottleMesh.add(liquidMesh);

  // Bottle Cap
  const capGeo = new THREE.CylinderGeometry(0.4, 0.4, 0.5, 32);
  const capMat = new THREE.MeshStandardMaterial({ color: 0xC5A059, metalness: 0.8, roughness: 0.2 });
  const capMesh = new THREE.Mesh(capGeo, capMat);
  capMesh.position.y = 1.45;
  bottleMesh.add(capMesh);

  threeScene.add(bottleMesh);

  // Interactive mouse drag rotation
  let isDragging = false;
  let prevMouse = { x: 0, y: 0 };
  container.addEventListener('mousedown', e => { isDragging = true; prevMouse = { x: e.clientX, y: e.clientY }; });
  window.addEventListener('mouseup', () => isDragging = false);
  container.addEventListener('mousemove', e => {
    if (!isDragging || !bottleMesh) return;
    const deltaX = e.clientX - prevMouse.x;
    const deltaY = e.clientY - prevMouse.y;
    bottleMesh.rotation.y += deltaX * 0.01;
    bottleMesh.rotation.x += deltaY * 0.01;
    prevMouse = { x: e.clientX, y: e.clientY };
  });

  function animate() {
    requestAnimationFrame(animate);
    if (!isDragging && bottleMesh) {
      bottleMesh.rotation.y += 0.005;
    }
    threeRenderer.render(threeScene, threeCamera);
  }
  animate();
}

function update3DLiquidColor(top, heart, base) {
  if (!liquidMesh) return;
  // Dynamic color calculation based on scent ratio
  const r = Math.min(255, Math.floor((top * 3.5) + (base * 2)));
  const g = Math.min(255, Math.floor((heart * 2.5) + 80));
  const b = Math.min(255, Math.floor(base * 1.5));
  liquidMesh.material.color.setRGB(r / 255, g / 255, b / 255);
}

          <div class="summarycard">
            <div class="summarylabel">Order Summary</div>
            <div class="totalrow"><span>Total:</span><span>R${cartTotal()}</span></div>
            <button class="btn" onclick="go('checkout')">Proceed to Checkout</button>
          </div>
        </div>`);
  }
  else if(state.screen==='checkout'){
    html = screenHeader('CHECKOUT', 'Secure Order', 'Delivery & Payment', 'Complete your details to send your order directly to our formulation lab.')
      + `<div class="split">
          <div class="card">
            <div class="field">
              <label class="field-label">Full Name</label>
              <input type="text" id="custName" value="${state.checkout.name}" placeholder="Anas Smith">
            </div>
            <div class="field">
              <label class="field-label">Street Address</label>
              <input type="text" id="custAddr" value="${state.checkout.address}" placeholder="123 Long Street">
            </div>
            <div class="field">
              <label class="field-label">City</label>
              <input type="text" id="custCity" value="${state.checkout.city}">
            </div>
            <button class="btn green" onclick="state.labStatus='formulating';renderScreen();toast('Order Placed Successfully!')">Place Order &amp; Pay R${cartTotal()}</button>
          </div>

          <div class="card">
            <div class="eyebrow">Real-time Lab Tracker</div>
            <div style="margin-top:16px;">
              <div class="tracker-step"><div class="tracker-dot ${state.labStatus!=='idle'?'done':'active'}"></div><span>Order Received</span></div>
              <div class="tracker-step"><div class="tracker-dot ${state.labStatus==='formulating'?'active':''}"></div><span>Formulating Oils in Lab</span></div>
              <div class="tracker-step"><div class="tracker-dot"></div><span>Bottling &amp; Custom Engraving</span></div>
              <div class="tracker-step"><div class="tracker-dot"></div><span>Dispatched via Courier</span></div>
            </div>
          </div>
        </div>`;
  }

  main.innerHTML = html;
  main.classList.remove('anim');
  void main.offsetWidth;
  main.classList.add('anim');
}

// Initial Kickoff
renderNav();
renderScreen();
</script>
</body>
</html>
