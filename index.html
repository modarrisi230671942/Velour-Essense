<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Velour Essence</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --burgundy:#3D0C13;
    --burgundy-dark:#2A080D;
    --gold:#C5A059;
    --gold-light:#E4CFA0;
    --silk:#F4EAD8;
    --cream:#FAF7F2;
    --ink:#2A2018;
    --gray:#7A7168;
    --line:#E8E0D0;
    --green:#1E8E3E;
    --green-bg:#EAF6ED;
    --green-text:#1E6B33;
    --red-bg:#FBEAEA;
    --red-text:#B3261E;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Plus Jakarta Sans',sans-serif;
    background: linear-gradient(180deg,#E9E2D3, #DDD4C1);
    min-height:100vh;
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding:32px 16px;
    color:var(--ink);
  }
  .frame{
    width:100%;
    max-width:1440px;
    background:var(--cream);
    border-radius:18px;
    overflow:hidden;
    box-shadow:0 30px 60px -20px rgba(61,12,19,0.35), 0 0 0 1px rgba(61,12,19,0.06);
  }
  .chrome{
    background:var(--burgundy);
    height:38px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 18px;
  }
  .dots{display:flex;gap:7px;}
  .dot{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,0.25);}
  .url{
    background:rgba(255,255,255,0.08);
    color:#F4EAD8;
    font-size:12px;
    padding:4px 12px;
    border-radius:20px;
    letter-spacing:0.3px;
  }
  .promo{
    background:var(--gold);
    color:var(--burgundy);
    font-size:13px;
    font-weight:700;
    text-align:center;
    padding:9px 16px;
    letter-spacing:0.2px;
  }
  .promo svg{vertical-align:-2px;margin-right:6px;}

  header.nav{
    background:#fff;
    border-bottom:1px solid var(--line);
    display:flex;
    align-items:center;
    gap:24px;
    padding:16px 32px;
  }
  .brandmark{
    display:flex;
    align-items:center;
    gap:12px;
    flex-shrink:0;
  }
  .crest{
    width:44px;height:44px;border-radius:50%;
    border:2px solid var(--gold);
    display:flex;align-items:center;justify-content:center;
    color:var(--burgundy);
    background:#fff;
  }
  .wordmark{
    font-family:'Cinzel',serif;
    font-weight:600;
    font-size:17px;
    line-height:1.15;
    color:var(--burgundy);
  }
  .tagline{
    font-size:9.5px;
    letter-spacing:1px;
    color:var(--gold);
    font-weight:700;
    text-transform:uppercase;
    margin-top:2px;
  }
  .navwrap{
    flex:1;
    min-width:0;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .navscroll{
    display:flex;
    gap:8px;
    overflow-x:auto;
    scrollbar-width:thin;
    padding-bottom:4px;
  }
  .navscroll::-webkit-scrollbar{height:5px;}
  .navscroll::-webkit-scrollbar-thumb{background:#c9bfa8;border-radius:10px;}
  .pill{
    flex-shrink:0;
    border:1px solid var(--line);
    background:#fff;
    color:var(--ink);
    font-size:12.5px;
    font-weight:600;
    padding:8px 14px;
    border-radius:20px;
    cursor:pointer;
    white-space:nowrap;
    display:flex;
    align-items:center;
    gap:6px;
    transition:all .15s ease;
  }
  .pill:hover{border-color:var(--gold);}
  .pill.active{
    background:var(--burgundy);
    color:#fff;
    border-color:var(--burgundy);
  }
  .pill.brandpill{
    background:var(--silk);
    border-color:var(--gold-light);
  }
  .pill.brandpill.active{
    background:var(--gold);
    color:var(--burgundy);
    border-color:var(--gold);
  }
  .badge{
    background:var(--gold);
    color:var(--burgundy);
    font-size:10.5px;
    font-weight:800;
    width:16px;height:16px;
    border-radius:50%;
    display:flex;align-items:center;justify-content:center;
  }
  .pill.active .badge{background:#fff;color:var(--burgundy);}
  .navarrow{
    background:none;border:none;color:var(--gray);cursor:pointer;font-size:16px;
    flex-shrink:0;
  }

  main{
    padding:36px 40px 60px;
    min-height:520px;
  }
  main.anim{animation:screenIn .32s ease;}
  @keyframes screenIn{
    from{opacity:0;transform:translateY(6px);}
    to{opacity:1;transform:translateY(0);}
  }
  @media (prefers-reduced-motion: reduce){
    main{animation:none;}
    .moodcard, .tiercard{transition:none;}
  }
  button:focus-visible, input:focus-visible, select:focus-visible, .pill:focus-visible, .quizopt:focus-visible{
    outline:2px solid var(--gold);
    outline-offset:2px;
  }
  .kicker{
    display:inline-block;
    background:var(--burgundy);
    color:#fff;
    font-size:11px;
    font-weight:700;
    letter-spacing:0.4px;
    padding:6px 12px;
    border-radius:20px;
    margin-bottom:14px;
  }
  .eyebrow{
    color:var(--gold);
    font-size:12px;
    font-weight:700;
    letter-spacing:1px;
    text-transform:uppercase;
    margin-bottom:6px;
  }
  h1{
    font-family:'Cinzel',serif;
    color:var(--burgundy);
    font-size:28px;
    margin:0 0 8px;
  }
  .subtext{color:var(--gray);font-size:14.5px;margin:0 0 28px;max-width:640px;}

  .grid{display:grid;gap:20px;}
  .grid-3{grid-template-columns:repeat(3,1fr);}
  .grid-2{grid-template-columns:repeat(2,1fr);}

  .card{
    background:#fff;
    border:1px solid var(--line);
    border-radius:14px;
    padding:26px;
    box-shadow:0 6px 20px rgba(61,12,19,0.05);
  }
  .card h3{
    font-family:'Cinzel',serif;
    color:var(--burgundy);
    font-size:19px;
    margin:0 0 10px;
    text-align:center;
  }
  .tag{
    display:inline-flex;align-items:center;gap:6px;
    background:var(--silk);
    color:var(--burgundy);
    font-size:12.5px;
    font-weight:600;
    padding:5px 12px;
    border-radius:20px;
    margin:0 auto 14px;
  }
  .tagrow{text-align:center;}
  .likebar{
    background:#F1ECE2;
    color:var(--gray);
    font-style:italic;
    font-size:13px;
    text-align:center;
    padding:8px;
    border-radius:6px;
    margin-bottom:14px;
  }
  .price{
    font-family:'Cinzel',serif;
    color:var(--burgundy);
    font-weight:700;
    font-size:24px;
    text-align:center;
    margin-bottom:16px;
  }
  .btn{
    display:block;
    width:100%;
    background:var(--burgundy);
    color:#fff;
    border:none;
    padding:13px;
    border-radius:7px;
    font-size:12.5px;
    font-weight:700;
    letter-spacing:0.6px;
    text-transform:uppercase;
    cursor:pointer;
    text-align:center;
    font-family:'Plus Jakarta Sans',sans-serif;
    transition:background .15s;
  }
  .btn:hover{background:var(--burgundy-dark);}
  .btn.green{background:var(--green);}
  .btn.green:hover{background:#166b2f;}
  .btn.ghost{background:transparent;color:var(--burgundy);border:1px solid var(--burgundy);}

  .voucherbar{
    background:var(--silk);
    color:var(--burgundy);
    font-size:12.5px;
    font-weight:600;
    padding:9px 12px;
    border-radius:6px;
    margin-bottom:16px;
  }
  .kitprice{
    font-family:'Cinzel',serif;
    color:var(--burgundy);
    font-weight:700;
    font-size:22px;
    margin-bottom:14px;
  }

  /* Personalize */
  .split{display:grid;grid-template-columns:1fr 1fr;gap:28px;align-items:start;}
  label.field-label{
    display:block;font-size:11px;font-weight:700;letter-spacing:0.6px;
    text-transform:uppercase;color:var(--gray);margin-bottom:8px;
  }
  .field{margin-bottom:22px;}
  .fielderror{color:var(--red-text);font-size:12px;font-weight:600;margin-top:6px;}
  input[type=text]{
    width:100%;
    padding:12px 14px;
    border:1px solid var(--line);
    border-radius:7px;
    font-size:14px;
    font-family:'Plus Jakarta Sans',sans-serif;
    color:var(--ink);
    background:#fff;
  }
  input[type=text]:focus{outline:2px solid var(--gold);border-color:var(--gold);}
  .preview-wrap{
    background:#F1ECE2;
    border:1px solid var(--line);
    border-radius:14px;
    padding:40px;
    display:flex;
    justify-content:center;
  }
  .bottlecap{
    width:34px;height:20px;background:var(--gold);
    border-radius:4px 4px 2px 2px;
    margin:0 auto -1px;
  }
  .label{
    width:220px;
    border:2px solid var(--gold);
    border-radius:8px;
    background:var(--cream);
    padding:26px 16px;
    text-align:center;
  }
  .label .lv{font-family:'Cinzel',serif;font-size:9px;letter-spacing:2px;color:var(--gray);margin-bottom:14px;}
  .label .lt{font-family:'Cinzel',serif;font-weight:700;font-size:15px;color:var(--burgundy);margin-bottom:6px;word-break:break-word;}
  .label .ls{font-size:8.5px;letter-spacing:1px;color:var(--gray);text-transform:uppercase;}

  /* cart / checkout */
  .cartlist{display:flex;flex-direction:column;gap:14px;}
  .cartitem{
    display:flex;align-items:center;gap:16px;
    background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px;
  }
  .cicon{
    width:38px;height:38px;border-radius:50%;border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--burgundy);
  }
  .cititle{font-weight:700;font-size:14.5px;}
  .cisub{font-size:12px;color:var(--gold);font-weight:600;margin-top:2px;}
  .ciprice{margin-left:auto;font-family:'Cinzel',serif;font-weight:700;color:var(--burgundy);font-size:16px;flex-shrink:0;text-align:right;}
  .ciunit{font-family:'Plus Jakarta Sans',sans-serif;font-weight:600;font-size:11px;color:var(--gray);margin-top:2px;}
  .qtystepper{display:flex;align-items:center;gap:10px;margin-top:8px;}
  .qtybtn{
    width:24px;height:24px;border-radius:50%;border:1px solid var(--line);background:#fff;
    color:var(--burgundy);font-size:15px;font-weight:700;line-height:1;cursor:pointer;
    display:flex;align-items:center;justify-content:center;transition:all .15s;
  }
  .qtybtn:hover{border-color:var(--gold);background:var(--silk);}
  .qtyval{font-size:13px;font-weight:700;min-width:16px;text-align:center;}
  .removebtn{
    flex-shrink:0;width:30px;height:30px;border-radius:50%;
    background:transparent;border:1px solid var(--line);color:var(--gray);
    display:flex;align-items:center;justify-content:center;cursor:pointer;
    margin-left:10px;transition:all .15s;
  }
  .removebtn:hover{background:var(--red-bg);border-color:var(--red-text);color:var(--red-text);}
  .btn:disabled{background:var(--line);color:var(--gray);cursor:not-allowed;}
  .btn:disabled:hover{background:var(--line);}
  .summarycard{background:#fff;border:1px solid var(--line);border-radius:12px;padding:22px;height:fit-content;}
  .summarylabel{color:var(--gold);font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;margin-bottom:14px;}
  .totalrow{display:flex;justify-content:space-between;font-weight:700;font-size:15px;margin-bottom:20px;padding-bottom:16px;border-bottom:1px solid var(--line);}

  .radio-row{
    display:flex;align-items:center;gap:12px;
    border:1px solid var(--line);border-radius:8px;
    padding:14px 16px;margin-bottom:10px;cursor:pointer;
    font-size:14px;font-weight:600;
    transition:all .15s;
  }
  .radio-row.selected{border-color:var(--burgundy);background:var(--silk);}
  .radiodot{width:18px;height:18px;border-radius:50%;border:2px solid var(--gray);flex-shrink:0;position:relative;}
  .radio-row.selected .radiodot{border-color:var(--burgundy);}
  .radio-row.selected .radiodot::after{
    content:'';position:absolute;inset:3px;border-radius:50%;background:var(--burgundy);
  }

  /* brand pages */
  .infocard h4{
    font-size:11px;letter-spacing:0.6px;text-transform:uppercase;color:var(--gold);
    margin:0 0 8px;font-weight:700;
  }
  .infocard strong{display:block;font-size:15px;margin-bottom:6px;color:var(--ink);}
  .infocard p, .infocard li{font-size:13.5px;color:var(--gray);line-height:1.6;}
  .infocard ul{margin:0;padding-left:18px;}
  .divider{border:none;border-top:1px solid var(--gold-light);margin:28px 0 20px;}
  h2.section{
    font-family:'Cinzel',serif;color:var(--burgundy);font-size:16px;margin:0 0 4px;
    display:flex;align-items:center;gap:9px;
  }
  h2.section::before{
    content:'';width:7px;height:7px;background:var(--gold);
    transform:rotate(45deg);flex-shrink:0;
  }

  .crestcard{text-align:center;padding:30px 20px;}
  .crestcard.dark{background:var(--burgundy);color:#fff;}
  .crestcard.dark .crestcircle{border-color:var(--gold);}
  .crestcircle{
    width:52px;height:52px;border-radius:50%;border:2px solid var(--burgundy);
    display:flex;align-items:center;justify-content:center;margin:0 auto 12px;
    font-family:'Cinzel',serif;font-weight:700;color:inherit;
  }
  .crestlabel{font-weight:700;font-size:14px;margin-bottom:4px;}
  .crestsub{font-size:12px;color:var(--gray);}
  .crestcard.dark .crestsub{color:#E4CFA0;}
  .prohibited{background:var(--red-bg);text-align:left;padding:22px;}
  .prohibited h4{color:var(--red-text);font-weight:700;font-size:13.5px;margin:0 0 8px;}
  .prohibited ul{margin:0;padding-left:16px;color:var(--red-text);font-size:12.5px;line-height:1.7;}

  .swatch{border-radius:12px;overflow:hidden;border:1px solid var(--line);}
  .swatchblock{height:80px;display:flex;align-items:flex-end;padding:10px;}
  .hexchip{background:rgba(0,0,0,0.15);color:#fff;font-size:11px;font-weight:700;padding:3px 8px;border-radius:5px;}
  .swatchmeta{background:#fff;padding:14px 16px;}
  .swatchname{font-weight:700;font-size:14px;}
  .swatchuse{font-size:12px;color:var(--gray);}

  .typecard{padding:24px;}
  .typelabel{font-size:11px;letter-spacing:0.6px;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:10px;}
  .typesample{font-size:20px;color:var(--burgundy);margin-bottom:8px;}
  .typesample.cinzel{font-family:'Cinzel',serif;font-weight:700;}
  .typesample.jakarta{font-family:'Plus Jakarta Sans',sans-serif;font-weight:700;color:var(--ink);}
  .typedesc{font-size:12.5px;color:var(--gray);}

  .tonecard{padding:20px;font-size:14px;border-radius:10px;font-style:italic;font-weight:600;}
  .tonecard.good{background:var(--green-bg);color:var(--green-text);}
  .tonecard.bad{background:var(--red-bg);color:var(--red-text);}
  .tonecard b{font-style:normal;margin-right:6px;}

  .imglist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px;}
  .imglist li{font-size:14px;color:var(--ink);}
  .imglist b{color:var(--burgundy);}

  .placeholder{
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:80px 20px;border:1px dashed var(--gold-light);border-radius:14px;
    color:var(--gray);text-align:center;gap:10px;
  }
  .placeholder h3{font-family:'Cinzel',serif;color:var(--burgundy);font-size:20px;margin:0;}

  .toast{
    position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(20px);
    background:var(--burgundy);color:#fff;padding:12px 22px;border-radius:30px;
    font-size:13.5px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,0.25);
    opacity:0;pointer-events:none;transition:all .25s ease;z-index:999;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  /* Sensory guarantee + tier pricing (Home) */
  .guarantee-card{
    background:#fff;border:1px solid var(--gold);border-left:4px solid var(--gold);
    border-radius:8px;padding:16px 18px;margin-bottom:24px;
    display:flex;gap:14px;align-items:flex-start;
  }
  .guarantee-card svg{flex-shrink:0;margin-top:2px;}
  .guarantee-card div{font-size:13.5px;line-height:1.55;color:var(--ink);}
  .tiergrid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:28px;}
  .tiercard{
    background:#fff;border:1px solid var(--line);border-radius:12px;
    padding:20px;text-align:center;cursor:pointer;transition:all .15s;
  }
  .tiercard:hover{transform:translateY(-2px);}
  .tiercard.featured{border:1.5px solid var(--gold);}
  .tiername{font-weight:700;color:var(--burgundy);font-size:13.5px;margin-bottom:6px;}
  .tierprice{font-family:'Cinzel',serif;color:var(--burgundy);font-weight:700;font-size:20px;}
  .tiersub{font-size:11.5px;color:var(--gold);font-weight:600;margin-top:4px;}

  /* Studio sliders */
  .studiogrid2{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
  .slidergroup{margin-bottom:18px;}
  .sliderlabel{display:flex;justify-content:space-between;font-size:13px;font-weight:600;margin-bottom:6px;}
  .sliderlabel span:last-child{color:var(--burgundy);font-family:'Cinzel',serif;}
  input[type=range]{
    width:100%;accent-color:var(--burgundy);
  }
  select.input-select{
    width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:7px;
    font-size:13.5px;font-family:'Plus Jakarta Sans',sans-serif;background:#fff;color:var(--ink);margin-top:6px;
  }
  .formulabox{
    display:flex;flex-direction:column;justify-content:space-between;height:100%;
  }

  .hero{
    display:grid;grid-template-columns:1.1fr 0.9fr;gap:36px;align-items:center;
    margin-bottom:44px;
  }
  .hero h1{font-size:34px;margin-bottom:14px;line-height:1.15;}
  .hero p.subtext{font-size:15.5px;margin-bottom:26px;}
  .herobtns{display:flex;gap:12px;}
  .herobtns .btn{width:auto;padding:13px 22px;}
  .heroart{
    border-radius:16px;overflow:hidden;
    display:flex;align-items:center;justify-content:center;
  }
  .heroart svg{width:100%;height:auto;display:block;}
  .moodgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-bottom:8px;}
  .moodcard{
    background:#fff;border:1px solid var(--line);border-radius:12px;padding:20px;
    cursor:pointer;transition:all .15s;text-align:center;
  }
  .moodcard:hover{border-color:var(--gold);transform:translateY(-2px);}
  .moodcard .micon{font-size:26px;margin-bottom:8px;}
  .moodcard b{display:block;font-size:14.5px;color:var(--burgundy);margin-bottom:4px;font-family:'Cinzel',serif;}
  .moodcard span{font-size:12px;color:var(--gray);}

  /* Studio */
  .studiogrid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-bottom:24px;}
  .notecol h4{
    font-size:11px;font-weight:700;letter-spacing:0.8px;text-transform:uppercase;
    color:var(--gold);margin-bottom:12px;
  }
  .chip{
    display:flex;align-items:center;justify-content:space-between;
    background:#fff;border:1px solid var(--line);border-radius:8px;
    padding:12px 14px;margin-bottom:8px;cursor:pointer;font-size:13.5px;font-weight:600;
    transition:all .15s;
  }
  .chip:hover{border-color:var(--gold-light);}
  .chip.selected{background:var(--burgundy);color:#fff;border-color:var(--burgundy);}
  .chip .check{opacity:0;}
  .chip.selected .check{opacity:1;}
  .blendpanel{
    background:#fff;border:1px solid var(--line);border-radius:14px;padding:28px;
    text-align:center;
  }
  .blendname{font-family:'Cinzel',serif;font-size:22px;color:var(--burgundy);font-weight:700;margin-bottom:6px;}
  .blenddesc{font-size:13.5px;color:var(--gray);margin-bottom:20px;}
  .blendnotes{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-bottom:22px;}
  .blendnotes span{
    background:var(--silk);color:var(--burgundy);font-size:12px;font-weight:600;
    padding:6px 12px;border-radius:20px;
  }

  /* Matcher / Quiz */
  .quizwrap{max-width:640px;}
  .quizprogress{display:flex;gap:6px;margin-bottom:24px;}
  .quizprogress .seg{flex:1;height:4px;border-radius:4px;background:var(--line);}
  .quizprogress .seg.done{background:var(--gold);}
  .quizq{font-family:'Cinzel',serif;font-size:19px;color:var(--burgundy);margin-bottom:18px;}
  .quizopt{

const QUIZ = [

  'Chanel Chance Eau Fraîche': {name:'Citrus Bloom', tag:'Morning • Coastal', key:'bloom'},

function cartCount(){ return state.cart.reduce((s,i)=>s+i.qty,0); }
function cartTotal(){ return state.cart.reduce((s,i)=>s+i.price*i.qty,0); }

function renderNav(){
  const wrap = document.getElementById('navscroll');
  wrap.innerHTML = '';
  NAV.forEach(item=>{
    const pill = document.createElement('button');
    pill.className = 'pill' + (item.brand?' brandpill':'') + (state.screen===item.id?' active':'');
    let inner = item.label;
    if(item.cart){
      inner += ` <span class="badge">${cartCount()}</span>`;
    }
    if(item.brand){
      inner = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h11l5 5v11H4z"/><path d="M15 4v5h5"/></svg> ` + inner;
    }
    pill.innerHTML = inner;
    pill.onclick = ()=>go(item.id);
    wrap.appendChild(pill);
  });
}

function scrollNav(dir){
  document.getElementById('navscroll').scrollBy({left: dir*220, behavior:'smooth'});
}

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(()=>t.classList.remove('show'), 1800);
}

function go(id){
  state.screen = id;
  renderNav();
  renderScreen();
  document.getElementById('main').scrollIntoView({behavior:'smooth', block:'start'});
}

function addToCart(item){
  const existing = state.cart.find(i=>i.key===item.key && i.title===item.title && i.price===item.price);
  if(existing){
    existing.qty += 1;
    toast(`Added another "${item.title}" (now ${existing.qty} in cart)`);
  } else {
    state.cart.push({...item, qty:1});
    toast(`Added "${item.title}" to cart`);
  }
  renderNav();
  renderScreen();
}

function removeFromCart(idx){
  const removed = state.cart[idx];
  state.cart.splice(idx,1);
  renderNav();
  toast(`Removed "${removed.title}" from cart`);
  renderScreen();
}

function updateQty(idx, delta){
  const item = state.cart[idx];
  if(!item) return;
  item.qty += delta;
  if(item.qty <= 0){
    removeFromCart(idx);
    return;
  }
  renderNav();
  renderScreen();
}

function screenHeader(kicker, eyebrow, title, sub){
  return `
    <span class="kicker">${kicker}</span>
    <div class="eyebrow">${eyebrow}</div>
    <h1>${title}</h1>
    <p class="subtext">${sub}</p>

}

function placeholder(name, note){
  return `<div class="placeholder">
    <h3>${name}</h3>
    <p style="max-width:420px;margin:0;font-size:13.5px;">${note}</p>
  </div>`;
}

}

/* ---------- Home helpers ---------- */
function tierCard(size, name, price, featured){
  return `<div class="tiercard ${featured?'featured':''}" onclick="selectTier('${size}')">
    <div class="tiername">${size} ${name}</div>
    <div class="tierprice">R${price}</div>
    <div class="tiersub">+ Free 2ml Sample</div>
  </div>`;
}
function selectTier(size){
  state.studio.size = size;
  state.studio.price = SIZE_PRICES[size];
  go('studio');
}

/* ---------- Studio helpers ---------- */
function updateSlider(which, val){
  state.studio[which] = parseInt(val,10);
  document.getElementById(which+'Val').textContent = val+'%';
  const tagEl = document.querySelector('#main .tag');
  if(tagEl) tagEl.textContent = formulaMood(state.studio);
}
function updateSize(size){
  state.studio.size = size;
  state.studio.price = SIZE_PRICES[size];
  renderScreen();
}
function formulaMood(s){
  if(s.top >= s.heart && s.top >= s.base) return '✨ Bright Citrus Lead • Balanced Heart';
  if(s.base >= s.top && s.base >= s.heart) return '🌙 Warm Woody Base • Deep & Grounded';
  return '🌸 Floral Heart Forward • Soft & Romantic';
}

/* ---------- Matcher / Quiz helpers ---------- */
function renderQuiz(){
  const total = QUIZ.length;
  const step = state.quizStep;
  const progress = Array.from({length: total}).map((_,i)=>`<div class="seg ${i<step?'done':''}"></div>`).join('');

  if(step >= total){
    const ref = state.quizAnswers.ref;
    const result = MATCH_RESULTS[ref] || {name:'Velour Noir', tag:'Late Night • Espresso', key:'noir'};
    return `<div class="quizwrap">
      <div class="quizprogress">${Array.from({length:total}).map(()=>'<div class="seg done"></div>').join('')}</div>
      <div class="resultcard">
        <div class="rlabel">Your Match</div>
        <h3>${result.name}</h3>
        <p>Based on your answers, ${result.name} (${result.tag}) is your closest Velour Essence match${ref?` for ${ref}`:''}.</p>
        <div class="resultbtns">
          <button class="btn" style="width:auto;" onclick="go('house')">View in House Collection</button>
          <button class="btn ghost" style="width:auto;" onclick="restartQuiz()">Retake Quiz</button>
        </div>
      </div>
    </div>`;
  }

  const q = QUIZ[step];
  const opts = q.options.map(o=>`<button class="quizopt" onclick="answerQuiz('${q.key}','${o.replace(/'/g,"\\'")}')">${o}</button>`).join('');
  return `<div class="quizwrap">
    <div class="quizprogress">${progress}</div>
    <div class="quizq">${step+1}. ${q.q}</div>
    ${opts}
    ${step>0 ? '<button class="btn ghost" style="width:auto;padding:10px 18px;margin-top:6px;" onclick="quizBack()">&larr; Back</button>' : ''}
  </div>`;
}
function answerQuiz(key,val){
  state.quizAnswers[key] = val;
  state.quizStep += 1;
  renderScreen();
}
function quizBack(){
  if(state.quizStep>0){
    state.quizStep -= 1;
    renderScreen();
  }
}
function restartQuiz(){
  state.quizStep = 0;
  state.quizAnswers = {};
  renderScreen();
}

function paymentRow(id,label){
  return `<div class="radio-row ${state.payment===id?'selected':''}" onclick="selectPayment('${id}')">
    <div class="radiodot"></div>${label}
  </div>`;
}
function selectPayment(id){
  state.payment = id;
  renderScreen();
}

function updateCheckout(val, which){
  state.checkout[which] = val;
  // Re-render only the Pay button's disabled state / error text without losing input focus
  const nameEl = document.getElementById('checkoutName');
  const addrEl = document.getElementById('checkoutAddress');
  const canPay = state.cart.length>0 && state.checkout.name.trim().length>1 && state.checkout.address.trim().length>4;
  const payBtn = document.querySelector('#main .btn.green');
  if(payBtn) payBtn.disabled = !canPay;
  const err = document.querySelector('#main .fielderror');
  if(canPay && err) err.remove();
  else if(!canPay && !err && addrEl){
    const div = document.createElement('div');
    div.className='fielderror';
    div.textContent='Please enter your full name and delivery address to continue.';
    addrEl.insertAdjacentElement('afterend', div);
  }
}

function submitPayment(){
  const c = state.checkout;
  if(state.cart.length===0){ toast('Your bag is empty'); return; }
  if(c.name.trim().length<2 || c.address.trim().length<5){ toast('Please complete your name and address'); return; }
  const paidTotal = cartTotal().toFixed(2);
  state.cart = [];
  state.checkout = {name:'', address:''};
  renderNav();
  toast(`Payment of R${paidTotal} simulated — thank you!`);
  go('home');
}

function updateLabel(val, which){
  if(which==='title'){
    state.fragranceTitle = val;
    document.getElementById('labelTitle').textContent = val || 'YOUR SIGNATURE';
  } else {
    state.fragranceSub = val;
    document.getElementById('labelSub').textContent = val;
  }
}

renderNav();
renderScreen();
</script>
